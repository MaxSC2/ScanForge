name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─── Quality (gate for all other jobs) ─────────────────────────
  quality:
    name: Validate + Typecheck + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm install --legacy-peer-deps --ignore-scripts
      - name: Local validation (scripts)
        run: npm run validate
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Run tests
        run: npx vitest run --reporter=verbose
        env:
          CI: true

  # ─── Web build ─────────────────────────────────────────────────
  web:
    name: Web (Vite)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm install --legacy-peer-deps --ignore-scripts
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [web]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  # ─── Desktop (Tauri) ──────────────────────────────────────────
  desktop:
    name: Desktop (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: AppImage
          - os: macos-latest
            target: x86_64-apple-darwin
            extension: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install target
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin
      - run: npm install --legacy-peer-deps --ignore-scripts
      - name: Build Tauri
        run: npx tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: scanforge-${{ matrix.os }}
          path: src-tauri/target/release/bundle/*/scanforge.${{ matrix.extension }}

  # ─── Android ──────────────────────────────────────────────────
  android:
    name: Android (.apk)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install Linux deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: nick-fields/action-setup-java@v2
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm install --legacy-peer-deps --ignore-scripts
      - name: Init Tauri Android
        run: npx tauri android init
      - name: Patch Android manifest
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>||g' "$MANIFEST"
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
            sed -i 's|usesCleartextTraffic="${usesCleartextTraffic}"|usesCleartextTraffic="true"|g' "$MANIFEST"
          fi
      - name: Strip devUrl (Tauri v2 bug #13832)
        run: python3 -c "import json; c=json.load(open('src-tauri/tauri.conf.json')); c['build'].pop('devUrl',None); json.dump(c,open('src-tauri/tauri.conf.json','w'),indent=2)"
      - name: Build APK
        run: npx tauri android build --apk
      - name: Sign APK
        run: |
          UNSIGNED=$(find src-tauri/gen/android -name '*-unsigned.apk' 2>/dev/null | head -1)
          [ -z "$UNSIGNED" ] && UNSIGNED=$(find src-tauri/gen/android -name '*.apk' 2>/dev/null | head -1)
          [ -z "$UNSIGNED" ] && echo "No APK" && exit 1
          BT=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | tail -1)
          KS="$HOME/.android/debug.keystore"
          [ ! -f "$KS" ] && mkdir -p $HOME/.android && keytool -genkey -v -keystore $KS -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp $UNSIGNED ${UNSIGNED%.apk}-signed.apk
          $BT/apksigner sign --ks $KS --ks-pass pass:android --ks-key-alias androiddebugkey ${UNSIGNED%.apk}-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: scanforge-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          compression-level: 0
